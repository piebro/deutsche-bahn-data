name: Fetch and Upload Deutsche Bahn Data
on:
  schedule:
    # Run every 6 hours at 3am, 9am, 3pm, 9pm UTC. The :17 minute offset
    # avoids the heavily contended top-of-the-hour, reducing the chance the
    # scheduled run is delayed or skipped by GitHub.
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date in YYYY-MM-DD format (requires hours; leave both empty for automatic repair)'
        required: false
        type: string
      hours:
        description: 'Comma-separated hours 0-23 (requires date; leave both empty for automatic 10-hour gap repair)'
        required: false
        type: string

concurrency:
  group: fetch-and-upload-deutsche-bahn-data
  cancel-in-progress: false

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --python 3.13

      - name: Determine hours to fetch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          DATE="${{ inputs.date }}"
          HOURS="${{ inputs.hours }}"

          if { [ -n "$DATE" ] && [ -z "$HOURS" ]; } || { [ -z "$DATE" ] && [ -n "$HOURS" ]; }; then
            echo "Manual runs must provide both date and hours."
            exit 1
          fi

          if [ -n "$DATE" ]; then
            MISSING_GROUPS=$(jq -nc \
              --arg date "$DATE" \
              --arg hours "$HOURS" \
              '[{date: $date, hours: ($hours | split(",") | map(tonumber))}]')
          else
            MISSING_GROUPS=$(uv run --with huggingface_hub \
              python scripts/find_missing_raw_data_hours.py --lookback-hours 10)
          fi

          echo "Hours to fetch: $MISSING_GROUPS"
          echo "missing_groups=$(echo "$MISSING_GROUPS" | jq -c .)" >> "$GITHUB_ENV"

      - name: Fetch missing Deutsche Bahn data
        if: env.missing_groups != '[]'
        env:
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
          DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
          MISSING_GROUPS: ${{ env.missing_groups }}
        run: |
          # Create .env file with API key
          echo "DB_API_KEY=$DB_API_KEY" > .env

          if [ "$MISSING_GROUPS" = "[]" ]; then
            echo "No data is missing in the last 10 hours."
            exit 0
          fi

          while IFS=$'\t' read -r GROUP_DATE GROUP_HOURS; do
            echo "Fetching $GROUP_DATE, hours $GROUP_HOURS"
            uv run python scripts/fetch_eva_plan_and_change.py \
              --categories 1,2,3,4,5,6,7 \
              --date "$GROUP_DATE" \
              --hours "$GROUP_HOURS"
          done < <(echo "$MISSING_GROUPS" | jq -r \
            '.[] | [.date, (.hours | map(tostring) | join(","))] | @tsv')

          echo "has_data=true" >> "$GITHUB_ENV"

      - name: Upload data to Hugging Face
        if: env.has_data == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bash scripts/upload_data_to_huggingface.sh
